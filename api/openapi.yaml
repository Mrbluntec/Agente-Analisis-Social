openapi: 3.1.0
info:
  title: Atalaya API
  version: 0.1.0
  summary: Contrato de la fase 1 — analítica orgánica y agente.
  description: |
    Una sola API para la web y, más adelante, para Android, iOS y macOS.

    Convenciones:
    - Fechas de día en `YYYY-MM-DD`, interpretadas en la zona horaria de la marca. Instantes en RFC 3339.
    - Todo periodo es cerrado: incluye `from` y `to`.
    - Las cifras viajan como números sin formato; el cliente da formato según su configuración regional.
    - Los errores usan `application/problem+json` (RFC 9457).
    - Las listas largas paginan con `cursor`; `next_cursor` nulo significa fin.
  license:
    name: Propietario
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.atalaya.example/v1
    description: Marcador de posición; el dominio real está por definir.
security:
  - cookieSession: []
  - bearerToken: []
tags:
  - name: Sesión
    description: Inicio y cierre de sesión, y datos del usuario actual.
  - name: Marcas
    description: Los clientes de la agencia; todo lo demás cuelga de una marca.
  - name: Cuentas sociales
    description: Conexión OAuth con cada red, estado y sincronización.
  - name: Analítica
    description: Indicadores, series temporales, anotaciones y diccionario de métricas.
  - name: Contenido
    description: Publicaciones con sus métricas, curva de vida y lectura creativa.
  - name: Claves de Ollama
    description: Clave de la agencia y clave personal; nunca se devuelven en claro.
  - name: Agente
    description: Conversaciones, ejecuciones con streaming, briefings, alertas, modelos y cola.

paths:
  /auth/login:
    post:
      tags: [Sesión]
      operationId: login
      summary: Iniciar sesión
      description: La web recibe una cookie de sesión; los clientes nativos piden `token` y lo envían como Bearer.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
                client: { $ref: '#/components/schemas/ClientKind' }
      responses:
        '200':
          description: Sesión creada.
          content:
            application/json:
              schema:
                type: object
                required: [user, expires_at]
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  expires_at: { type: string, format: date-time }
                  token:
                    type: string
                    description: Solo para clientes nativos.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout:
    post:
      tags: [Sesión]
      operationId: logout
      summary: Cerrar sesión
      responses:
        '204': { description: Sesión revocada. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me:
    get:
      tags: [Sesión]
      operationId: getMe
      summary: Usuario actual y sus organizaciones
      responses:
        '200':
          description: Usuario, pertenencias y estado de sus claves.
          content:
            application/json:
              schema:
                type: object
                required: [user, memberships]
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  memberships:
                    type: array
                    items: { $ref: '#/components/schemas/Membership' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /orgs/{orgId}/brands:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Marcas]
      operationId: listBrands
      summary: Marcas de la organización
      responses:
        '200':
          description: Marcas activas, con su titular de la semana si existe.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Brand' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Marcas]
      operationId: createBrand
      summary: Crear una marca
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                timezone: { type: string, default: America/Guayaquil }
                voice: { type: string, maxLength: 2000 }
      responses:
        '201':
          description: Marca creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Brand' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }

  /brands/{brandId}/accounts:
    parameters:
      - $ref: '#/components/parameters/BrandId'
    get:
      tags: [Cuentas sociales]
      operationId: listAccounts
      summary: Cuentas conectadas a la marca
      responses:
        '200':
          description: Cuentas propias y de la competencia, con su estado de sincronización.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SocialAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /brands/{brandId}/accounts/connect:
    parameters:
      - $ref: '#/components/parameters/BrandId'
    post:
      tags: [Cuentas sociales]
      operationId: startAccountConnection
      summary: Iniciar la conexión OAuth con una red
      description: Devuelve la URL de autorización de la red. El cliente la abre; la red redirige al callback del servidor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [network, return_url]
              properties:
                network: { $ref: '#/components/schemas/Network' }
                return_url:
                  type: string
                  format: uri
                  description: Dónde vuelve el usuario al terminar; debe pertenecer a un origen permitido.
      responses:
        '200':
          description: URL de autorización.
          content:
            application/json:
              schema:
                type: object
                required: [authorize_url, state]
                properties:
                  authorize_url: { type: string, format: uri }
                  state: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }

  /oauth/{network}/callback:
    get:
      tags: [Cuentas sociales]
      operationId: oauthCallback
      summary: Retorno de la red tras autorizar
      security: []
      parameters:
        - name: network
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Network' }
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: error
          in: query
          schema: { type: string }
      responses:
        '302':
          description: Redirige a `return_url` con `connected=<accountId>` o `error=<código>`.
          headers:
            Location:
              schema: { type: string, format: uri }
        '400': { $ref: '#/components/responses/Invalid' }

  /accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    delete:
      tags: [Cuentas sociales]
      operationId: disconnectAccount
      summary: Desconectar una cuenta
      description: Revoca el token y borra sus datos según la política de retención.
      responses:
        '204': { description: Cuenta desconectada. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /accounts/{accountId}/sync:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [Cuentas sociales]
      operationId: requestSync
      summary: Pedir una sincronización ahora
      responses:
        '202':
          description: Sincronización en cola.
          content:
            application/json:
              schema:
                type: object
                required: [sync_run_id]
                properties:
                  sync_run_id: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /metrics/definitions:
    get:
      tags: [Analítica]
      operationId: listMetricDefinitions
      summary: Diccionario de métricas
      description: Definición propia de cada métrica y la nativa de cada red, con su vigencia.
      responses:
        '200':
          description: Diccionario completo.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MetricDefinition' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /brands/{brandId}/summary:
    parameters:
      - $ref: '#/components/parameters/BrandId'
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      - $ref: '#/components/parameters/Compare'
      - $ref: '#/components/parameters/Networks'
    get:
      tags: [Analítica]
      operationId: getBrandSummary
      summary: Resumen de marca
      description: Indicadores del periodo con su comparación, desglose por red, índice de formato y la lectura del agente si existe.
      responses:
        '200':
          description: Resumen del periodo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /brands/{brandId}/timeseries:
    parameters:
      - $ref: '#/components/parameters/BrandId'
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      - $ref: '#/components/parameters/Compare'
      - $ref: '#/components/parameters/Networks'
      - name: metric
        in: query
        required: true
        schema: { type: string, examples: [reach] }
      - name: granularity
        in: query
        schema: { type: string, enum: [day, week], default: day }
    get:
      tags: [Analítica]
      operationId: getTimeseries
      summary: Serie temporal de una métrica
      responses:
        '200':
          description: Serie del periodo y, si se pidió, la del periodo de comparación alineada punto a punto.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Timeseries' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /brands/{brandId}/annotations:
    parameters:
      - $ref: '#/components/parameters/BrandId'
    get:
      tags: [Analítica]
      operationId: listAnnotations
      summary: Anotaciones sobre la línea de tiempo
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Anotaciones del periodo.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Annotation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Analítica]
      operationId: createAnnotation
      summary: Añadir una anotación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [occurred_on, label]
              properties:
                occurred_on: { type: string, format: date }
                label: { type: string, minLength: 1, maxLength: 120 }
                post_id: { type: string, format: uuid }
      responses:
        '201':
          description: Anotación creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Annotation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }

  /brands/{brandId}/posts:
    parameters:
      - $ref: '#/components/parameters/BrandId'
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      - $ref: '#/components/parameters/Networks'
      - name: format
        in: query
        schema:
          type: array
          items: { $ref: '#/components/schemas/PostFormat' }
        style: form
        explode: false
      - name: pillar
        in: query
        schema: { type: string }
      - name: sort
        in: query
        description: Métrica de orden; un guion delante invierte a mayor primero.
        schema: { type: string, default: -reach, examples: [-reach, published_at, -saves] }
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
    get:
      tags: [Contenido]
      operationId: listPosts
      summary: Publicaciones del periodo
      responses:
        '200':
          description: Publicaciones con sus métricas más recientes y su relación con la mediana de la cuenta.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, account_median_reach, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PostRow' }
                  total: { type: integer, minimum: 0 }
                  account_median_reach: { type: [number, 'null'] }
                  insight: { $ref: '#/components/schemas/Insight' }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /posts/{postId}:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      tags: [Contenido]
      operationId: getPost
      summary: Detalle de una publicación
      responses:
        '200':
          description: Publicación con métricas, curva de vida y lectura creativa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /brands/{brandId}/briefings/latest:
    parameters:
      - $ref: '#/components/parameters/BrandId'
    get:
      tags: [Agente]
      operationId: getLatestBriefing
      summary: Briefing semanal más reciente
      responses:
        '200':
          description: Briefing de la última semana cerrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Briefing' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /brands/{brandId}/alerts:
    parameters:
      - $ref: '#/components/parameters/BrandId'
      - name: open
        in: query
        description: Solo las no atendidas.
        schema: { type: boolean, default: true }
    get:
      tags: [Agente]
      operationId: listAlerts
      summary: Alertas de la marca
      responses:
        '200':
          description: Alertas con su diagnóstico.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Alert' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orgs/{orgId}/ollama-keys:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Claves de Ollama]
      operationId: listOllamaKeys
      summary: Estado de las claves
      description: Nunca devuelve la clave; solo sus cuatro últimos caracteres y su estado.
      responses:
        '200':
          description: Clave de la agencia y clave personal del usuario, si existen.
          content:
            application/json:
              schema:
                type: object
                required: [org_key, user_key]
                properties:
                  org_key:
                    oneOf:
                      - $ref: '#/components/schemas/OllamaKey'
                      - type: 'null'
                  user_key:
                    oneOf:
                      - $ref: '#/components/schemas/OllamaKey'
                      - type: 'null'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /orgs/{orgId}/ollama-keys/{scope}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - name: scope
        in: path
        required: true
        description: "`org` exige rol de administrador; `user` es la clave personal de quien llama."
        schema: { $ref: '#/components/schemas/KeyScope' }
    put:
      tags: [Claves de Ollama]
      operationId: setOllamaKey
      summary: Registrar o reemplazar una clave
      description: El servidor la valida contra Ollama Cloud, la cifra y revoca la anterior del mismo alcance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties:
                api_key: { type: string, format: password, minLength: 8, writeOnly: true }
                max_concurrency:
                  type: integer
                  minimum: 1
                  maximum: 64
                  description: Peticiones simultáneas que permite el plan de esa clave. Por defecto, 1.
      responses:
        '200':
          description: Clave validada y guardada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OllamaKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Ollama Cloud rechazó la clave o no respondió.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [Claves de Ollama]
      operationId: revokeOllamaKey
      summary: Revocar una clave
      responses:
        '204': { description: Clave revocada. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orgs/{orgId}/agent/models:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Agente]
      operationId: listAgentModels
      summary: Modelos disponibles con la clave en uso
      description: Se descubren en Ollama Cloud y se guardan en caché; no hay lista fija en el servidor. Solo aparecen los que declaran visión, herramientas y razonamiento.
      responses:
        '200':
          description: Modelos con sus capacidades.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AgentModel' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /orgs/{orgId}/agent/queue:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Agente]
      operationId: getAgentQueue
      summary: Cola del agente
      responses:
        '200':
          description: Ocupación de la clave que usaría quien llama y tareas en curso o en espera.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentQueue' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/NoOllamaKey' }

  /brands/{brandId}/agent/conversations:
    parameters:
      - $ref: '#/components/parameters/BrandId'
    get:
      tags: [Agente]
      operationId: listConversations
      summary: Conversaciones de la marca
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Conversaciones, la más reciente primero.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Conversation' }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Agente]
      operationId: createConversation
      summary: Abrir una conversación con su primera pregunta
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewMessage' }
      responses:
        '202':
          description: Conversación creada y ejecución en cola.
          content:
            application/json:
              schema:
                type: object
                required: [conversation, run]
                properties:
                  conversation: { $ref: '#/components/schemas/Conversation' }
                  run: { $ref: '#/components/schemas/AgentRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/NoOllamaKey' }
        '422': { $ref: '#/components/responses/Invalid' }

  /agent/conversations/{conversationId}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [Agente]
      operationId: getConversation
      summary: Conversación con todas sus ejecuciones
      responses:
        '200':
          description: Conversación completa.
          content:
            application/json:
              schema:
                type: object
                required: [conversation, runs]
                properties:
                  conversation: { $ref: '#/components/schemas/Conversation' }
                  runs:
                    type: array
                    items: { $ref: '#/components/schemas/AgentRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agent/conversations/{conversationId}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [Agente]
      operationId: sendMessage
      summary: Hacer otra pregunta en la conversación
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewMessage' }
      responses:
        '202':
          description: Ejecución en cola; siga su progreso en `/agent/runs/{runId}/events`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NoOllamaKey' }
        '422': { $ref: '#/components/responses/Invalid' }

  /agent/runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Agente]
      operationId: getRun
      summary: Estado y resultado de una ejecución
      responses:
        '200':
          description: Ejecución con razonamiento, herramientas, respuesta y citas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Agente]
      operationId: cancelRun
      summary: Cancelar una ejecución en cola o en curso
      responses:
        '204': { description: Cancelada. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: La ejecución ya había terminado.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /agent/runs/{runId}/events:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - name: Last-Event-ID
        in: header
        description: Reanuda desde el evento siguiente al indicado tras una reconexión.
        schema: { type: string }
    get:
      tags: [Agente]
      operationId: streamRunEvents
      summary: Progreso de una ejecución en streaming
      description: |
        Server-Sent Events. Cada evento lleva `id`, `event` y `data` en JSON con la forma de `AgentEvent`.
        Orden habitual: `run.queued` → `run.started` → `thinking.delta`* → (`tool.call` → `tool.result`)* →
        `answer.delta`* → `citation`* → `run.completed`. El flujo se cierra tras `run.completed`,
        `run.failed` o `run.cancelled`. Una ejecución ya terminada reproduce sus eventos y cierra.
      responses:
        '200':
          description: Flujo de eventos.
          content:
            text/event-stream:
              schema:
                type: string
                description: Secuencia de eventos; el campo `data` de cada uno cumple `AgentEvent`.
              examples:
                herramienta:
                  summary: Llamada a herramienta y primer fragmento de respuesta
                  value: |
                    id: 7
                    event: tool.call
                    data: {"type":"tool.call","seq":1,"tool":"detectar_anomalias","arguments":{"metric":"reach","format":"story"}}

                    id: 8
                    event: tool.result
                    data: {"type":"tool.result","seq":1,"summary":"Historias del 1 oct: 2050, 34 % bajo la media de los jueves.","duration_ms":212}

                    id: 9
                    event: answer.delta
                    data: {"type":"answer.delta","text":"Por la hora: "}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: atalaya_session
      description: Cookie HttpOnly, Secure, SameSite=Lax. Las peticiones que modifican estado exigen además la cabecera `X-CSRF-Token`.
    bearerToken:
      type: http
      scheme: bearer
      description: Para clientes nativos.

  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BrandId:
      name: brandId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PostId:
      name: postId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    From:
      name: from
      in: query
      required: true
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      required: true
      schema: { type: string, format: date }
    Compare:
      name: compare
      in: query
      description: "`previous` compara con el periodo inmediatamente anterior de igual duración."
      schema: { type: string, enum: [none, previous], default: previous }
    Networks:
      name: networks
      in: query
      description: Redes a incluir; sin el parámetro, todas las conectadas.
      schema:
        type: array
        items: { $ref: '#/components/schemas/Network' }
      style: form
      explode: false
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }

  responses:
    Unauthorized:
      description: Sin sesión válida.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: El rol no permite esta operación.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No existe o no pertenece a una organización del usuario.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Invalid:
      description: Parámetros o cuerpo no válidos.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Demasiadas peticiones; reintente tras `Retry-After`.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NoOllamaKey:
      description: No hay clave de Ollama utilizable, ni personal ni de la agencia.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: Código estable para que el cliente decida qué mostrar.
          examples: [no_ollama_key, ollama_key_rejected, period_too_long]
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    ClientKind:
      type: string
      enum: [web, android, ios, macos]
      default: web
    Network:
      type: string
      enum: [instagram, facebook, tiktok, youtube, linkedin, x]
    PostFormat:
      type: string
      enum: [reel, carousel, image, story, video, short, text, link]
    MemberRole:
      type: string
      enum: [owner, admin, analyst, editor, viewer]
    KeyScope:
      type: string
      enum: [org, user]
    AgentMode:
      type: string
      enum: [analyst, briefing, sentinel, auditor, writer]
    RunStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]

    User:
      type: object
      required: [id, email, name]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }

    Membership:
      type: object
      required: [org_id, org_name, role, has_org_ollama_key, has_user_ollama_key]
      properties:
        org_id: { type: string, format: uuid }
        org_name: { type: string }
        role: { $ref: '#/components/schemas/MemberRole' }
        has_org_ollama_key: { type: boolean }
        has_user_ollama_key: { type: boolean }

    Brand:
      type: object
      required: [id, org_id, name, slug, timezone, networks]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        timezone: { type: string }
        voice: { type: [string, 'null'] }
        networks:
          type: array
          description: Redes con al menos una cuenta propia conectada.
          items: { $ref: '#/components/schemas/Network' }
        week_headline:
          type: [string, 'null']
          description: Titular del último briefing, para la lista de la cartera.

    SocialAccount:
      type: object
      required: [id, brand_id, network, handle, is_competitor, status]
      properties:
        id: { type: string, format: uuid }
        brand_id: { type: string, format: uuid }
        network: { $ref: '#/components/schemas/Network' }
        handle: { type: string }
        display_name: { type: [string, 'null'] }
        is_competitor: { type: boolean }
        status:
          type: string
          enum: [active, needs_reauth, paused, disconnected]
        last_synced_at: { type: [string, 'null'], format: date-time }
        data_through:
          type: [string, 'null']
          format: date
          description: Último día con datos completos; algunas redes entregan con retraso.
        last_error: { type: [string, 'null'] }

    MetricDefinition:
      type: object
      required: [key, label, unit, rollup, description, networks]
      properties:
        key: { type: string }
        label: { type: string }
        unit: { type: string, enum: [count, percent, seconds, minutes, currency] }
        rollup: { type: string, enum: [sum, last, avg] }
        description: { type: string }
        networks:
          type: array
          items:
            type: object
            required: [network, native_name, definition, valid_from]
            properties:
              network: { $ref: '#/components/schemas/Network' }
              native_name: { type: string }
              definition: { type: string }
              valid_from: { type: string, format: date }
              valid_to: { type: [string, 'null'], format: date }

    Period:
      type: object
      required: [from, to]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }

    Kpi:
      type: object
      required: [metric, value, unit]
      properties:
        metric: { type: string }
        value: { type: number }
        unit: { type: string, enum: [count, percent, seconds, minutes, currency] }
        previous: { type: [number, 'null'] }
        delta:
          type: [number, 'null']
          description: Variación relativa (0.184 = +18,4 %); en métricas porcentuales, diferencia en puntos.
        delta_kind: { type: string, enum: [relative, points, absolute] }
        up_is_good: { type: boolean, default: true }
        sparkline:
          type: array
          description: Doce valores semanales que terminan en el periodo actual.
          items: { type: number }

    Insight:
      type: object
      description: Frase de lectura del agente con la que abre cada vista.
      required: [text, run_id, generated_at]
      properties:
        text: { type: string }
        run_id: { type: string, format: uuid }
        generated_at: { type: string, format: date-time }

    BrandSummary:
      type: object
      required: [period, kpis, by_network, format_index]
      properties:
        period: { $ref: '#/components/schemas/Period' }
        compare_period:
          oneOf:
            - $ref: '#/components/schemas/Period'
            - type: 'null'
        insight: { $ref: '#/components/schemas/Insight' }
        kpis:
          type: array
          items: { $ref: '#/components/schemas/Kpi' }
        by_network:
          type: array
          items:
            type: object
            required: [network, metric, value]
            properties:
              network: { $ref: '#/components/schemas/Network' }
              metric: { type: string }
              value: { type: number }
              delta: { type: [number, 'null'] }
        format_index:
          type: array
          description: Alcance mediano de cada formato dividido entre la mediana de la cuenta.
          items:
            type: object
            required: [format, posts, index]
            properties:
              format: { $ref: '#/components/schemas/PostFormat' }
              posts: { type: integer, minimum: 0 }
              index: { type: number, minimum: 0 }
        account_median_reach: { type: [number, 'null'] }

    Timeseries:
      type: object
      required: [metric, unit, granularity, points]
      properties:
        metric: { type: string }
        unit: { type: string, enum: [count, percent, seconds, minutes, currency] }
        granularity: { type: string, enum: [day, week] }
        points:
          type: array
          items:
            type: object
            required: [date, value]
            properties:
              date: { type: string, format: date }
              value: { type: [number, 'null'], description: Nulo si la red aún no entregó ese día. }
              previous_date: { type: [string, 'null'], format: date }
              previous_value: { type: [number, 'null'] }

    Annotation:
      type: object
      required: [id, occurred_on, label]
      properties:
        id: { type: string, format: uuid }
        occurred_on: { type: string, format: date }
        label: { type: string }
        post_id: { type: [string, 'null'], format: uuid }

    PostRow:
      type: object
      required: [id, network, format, published_at, metrics]
      properties:
        id: { type: string, format: uuid }
        network: { $ref: '#/components/schemas/Network' }
        format: { $ref: '#/components/schemas/PostFormat' }
        published_at: { type: string, format: date-time }
        title: { type: [string, 'null'] }
        permalink: { type: [string, 'null'], format: uri }
        thumbnail_url: { type: [string, 'null'], format: uri }
        pillar: { type: [string, 'null'] }
        metrics:
          type: object
          description: Último valor de cada métrica; falta la clave si la red no la ofrece.
          additionalProperties: { type: number }
          examples:
            - { reach: 14800, likes: 902, comments: 77, shares: 187, saves: 312 }
        engagement_rate:
          type: [number, 'null']
          description: Interacciones entre alcance (0.094 = 9,4 %).
        vs_median:
          type: [number, 'null']
          description: Alcance de la pieza entre la mediana de la cuenta (3.2 = 3,2×).
        life_curve_72h:
          type: array
          description: Alcance acumulado cada 6 horas durante las primeras 72; 13 valores.
          items: { type: number }

    PostDetail:
      allOf:
        - $ref: '#/components/schemas/PostRow'
        - type: object
          required: [life_curve]
          properties:
            caption: { type: [string, 'null'] }
            duration_seconds: { type: [integer, 'null'] }
            life_curve:
              type: object
              required: [metric, points, median_points]
              properties:
                metric: { type: string }
                points:
                  type: array
                  items: { $ref: '#/components/schemas/CurvePoint' }
                median_points:
                  type: array
                  description: La misma curva para la pieza mediana de la cuenta.
                  items: { $ref: '#/components/schemas/CurvePoint' }
            creative_reading:
              oneOf:
                - type: object
                  required: [items, model, run_id]
                  properties:
                    items:
                      type: array
                      items:
                        type: object
                        required: [aspect, text]
                        properties:
                          aspect: { type: string, examples: [Gancho, Texto, Ritmo] }
                          text: { type: string }
                    model: { type: string }
                    run_id: { type: string, format: uuid }
                - type: 'null'

    CurvePoint:
      type: object
      required: [hours, value]
      properties:
        hours: { type: number, minimum: 0, description: Horas desde la publicación. }
        value: { type: number }

    OllamaKey:
      type: object
      required: [scope, last4, max_concurrency, created_at]
      properties:
        scope: { $ref: '#/components/schemas/KeyScope' }
        last4: { type: string, minLength: 4, maxLength: 4 }
        max_concurrency: { type: integer, minimum: 1 }
        validated_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    AgentModel:
      type: object
      required: [name, thinking, tools, vision]
      properties:
        name: { type: string }
        thinking:
          type: array
          description: Valores que el modelo admite en `think`; vacío si no razona.
          items: { type: string }
        thinking_default: { type: [string, 'null'] }
        tools: { type: boolean }
        vision: { type: boolean }
        audio:
          type: boolean
          description: Verdadero si el modelo declara entrada de audio. No es requisito para aparecer en la lista.

    AgentQueue:
      type: object
      required: [key_scope, max_concurrency, running, queued]
      properties:
        key_scope: { $ref: '#/components/schemas/KeyScope' }
        max_concurrency: { type: integer, minimum: 1 }
        running:
          type: array
          items: { $ref: '#/components/schemas/QueueItem' }
        queued:
          type: array
          items: { $ref: '#/components/schemas/QueueItem' }

    QueueItem:
      type: object
      required: [run_id, mode, brand_name, queued_at]
      properties:
        run_id: { type: string, format: uuid }
        mode: { $ref: '#/components/schemas/AgentMode' }
        brand_name: { type: string }
        queued_at: { type: string, format: date-time }

    Conversation:
      type: object
      required: [id, brand_id, title, mode, created_at]
      properties:
        id: { type: string, format: uuid }
        brand_id: { type: string, format: uuid }
        title: { type: string }
        mode: { $ref: '#/components/schemas/AgentMode' }
        created_at: { type: string, format: date-time }

    NewMessage:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 4000 }
        mode: { $ref: '#/components/schemas/AgentMode' }
        model:
          type: string
          description: Sin él, el servidor elige según la tarea.
        think:
          type: string
          description: Nivel de razonamiento entre los que admite el modelo.
        context:
          type: object
          description: Lo que el usuario tenía en pantalla al preguntar.
          properties:
            period: { $ref: '#/components/schemas/Period' }
            networks:
              type: array
              items: { $ref: '#/components/schemas/Network' }
            post_id: { type: string, format: uuid }
            chart:
              type: string
              description: Identificador del gráfico sobre el que se pregunta.

    AgentRun:
      type: object
      required: [id, mode, status, model, question, key_scope, queued_at]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: [string, 'null'], format: uuid }
        mode: { $ref: '#/components/schemas/AgentMode' }
        status: { $ref: '#/components/schemas/RunStatus' }
        model: { type: string }
        think: { type: [string, 'null'] }
        key_scope: { $ref: '#/components/schemas/KeyScope' }
        question: { type: string }
        thinking: { type: [string, 'null'] }
        answer: { type: [string, 'null'] }
        tool_calls:
          type: array
          items: { $ref: '#/components/schemas/ToolCall' }
        citations:
          type: array
          items: { $ref: '#/components/schemas/Citation' }
        queued_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        prompt_tokens: { type: [integer, 'null'], description: Tokens de entrada sumados en todas las vueltas. }
        completion_tokens: { type: [integer, 'null'], description: Tokens generados sumados en todas las vueltas. }
        error: { type: [string, 'null'] }

    ToolCall:
      type: object
      required: [seq, tool, arguments]
      properties:
        seq: { type: integer, minimum: 1 }
        tool: { type: string }
        arguments: { type: object, additionalProperties: true }
        result_summary: { type: [string, 'null'] }
        duration_ms: { type: [integer, 'null'] }

    Citation:
      type: object
      description: Vincula un [n] del texto con la consulta que produjo la cifra.
      required: [ref, label, tool, query]
      properties:
        ref: { type: integer, minimum: 1 }
        label: { type: string }
        tool: { type: string }
        query: { type: object, additionalProperties: true }

    Briefing:
      type: object
      required: [id, brand_id, week_start, headline, kpis, findings, run_id, created_at]
      properties:
        id: { type: string, format: uuid }
        brand_id: { type: string, format: uuid }
        week_start: { type: string, format: date }
        headline: { type: string }
        kpis:
          type: array
          items: { $ref: '#/components/schemas/Kpi' }
        findings:
          type: array
          items:
            type: object
            required: [title, evidence]
            properties:
              title: { type: string }
              evidence: { type: string }
              link:
                type: object
                description: A qué vista lleva «ver evidencia».
                required: [view]
                properties:
                  view: { type: string, enum: [summary, posts, post, agent_run] }
                  id: { type: string, format: uuid }
        recommendation: { type: [string, 'null'] }
        run_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    Alert:
      type: object
      required: [id, severity, occurred_on, title]
      properties:
        id: { type: string, format: uuid }
        severity: { type: string, enum: [warning, serious, critical] }
        network:
          oneOf:
            - $ref: '#/components/schemas/Network'
            - type: 'null'
        metric: { type: [string, 'null'] }
        occurred_on: { type: string, format: date }
        title: { type: string }
        diagnosis: { type: [string, 'null'] }
        post_id: { type: [string, 'null'], format: uuid }
        run_id: { type: [string, 'null'], format: uuid }
        acknowledged_at: { type: [string, 'null'], format: date-time }

    AgentEvent:
      description: Carga del campo `data` de cada evento del flujo.
      oneOf:
        - type: object
          required: [type]
          properties:
            type: { type: string, enum: [run.queued, run.started, run.cancelled] }
            position: { type: integer, minimum: 0, description: 'Puesto en la cola; solo en `run.queued`.' }
        - type: object
          required: [type, text]
          properties:
            type: { type: string, enum: [thinking.delta, answer.delta] }
            text: { type: string }
        - type: object
          required: [type, seq, tool, arguments]
          properties:
            type: { type: string, const: tool.call }
            seq: { type: integer, minimum: 1 }
            tool: { type: string }
            arguments: { type: object, additionalProperties: true }
        - type: object
          required: [type, seq, summary]
          properties:
            type: { type: string, const: tool.result }
            seq: { type: integer, minimum: 1 }
            summary: { type: string }
            duration_ms: { type: integer }
        - type: object
          required: [type, citation]
          properties:
            type: { type: string, const: citation }
            citation: { $ref: '#/components/schemas/Citation' }
        - type: object
          required: [type, run]
          properties:
            type: { type: string, const: run.completed }
            run: { $ref: '#/components/schemas/AgentRun' }
        - type: object
          required: [type, error]
          properties:
            type: { type: string, const: run.failed }
            error: { type: string }
            code: { type: string, examples: [ollama_unavailable, ollama_key_rejected, tool_error] }
